<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windkanal</title>
    <style>
      :root {
        color-scheme: light;
        --grund: #fcfcfb;
        --schrift: #0b0b0b;
        --schrift-leise: #52514e;
        --linie: #e3e2dd;
        --knopf-grund: #ffffff;
        --knopf-gewaehlt: #1c5cab;
        --knopf-gewaehlt-schrift: #ffffff;
      }

      body {
        margin: 0;
        padding: 2rem 1rem 3rem;
        background: var(--grund);
        color: var(--schrift);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 60rem;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }

      .untertitel {
        margin: 0 0 1.5rem;
        color: var(--schrift-leise);
      }

      /* Die Bedienleiste bricht auf schmalen Bildschirmen um, statt über den
         Rand hinauszulaufen. Das eigentliche Sitzen auf Handy und Tablet ist
         Etappe 4.2 — hier geht es nur darum, dass nichts abgeschnitten wird. */
      .bedienleiste {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem 2rem;
        margin: 0 0 1rem;
      }

      .gruppentitel {
        display: block;
        font-size: 0.8125rem;
        color: var(--schrift-leise);
        margin-bottom: 0.375rem;
      }

      .knopfreihe {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      /* Mindestens 44 Bildpunkte hoch — darunter trifft man die Fläche mit dem
         Finger nicht zuverlässig, und Etappe 2.3 wird auf dem Handy geprüft. */
      .schaltflaeche {
        min-height: 2.75rem;
        padding: 0 1rem;
        font: inherit;
        font-size: 0.9375rem;
        color: var(--schrift);
        background: var(--knopf-grund);
        border: 1px solid var(--linie);
        border-radius: 4px;
        cursor: pointer;
        touch-action: manipulation;
      }

      .schaltflaeche:hover {
        border-color: var(--schrift-leise);
      }

      .schaltflaeche[aria-pressed="true"] {
        background: var(--knopf-gewaehlt);
        border-color: var(--knopf-gewaehlt);
        color: var(--knopf-gewaehlt-schrift);
      }

      /* Die Zeichenfläche ist nur 200 × 60 Bildpunkte groß — ein Punkt je
         Rechenzelle. Der Browser vergrößert sie hier auf Bildschirmbreite und
         glättet dabei; das spart eigenen Vergrößerungscode. */
      #stroemungsbild {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid var(--linie);
        border-radius: 4px;
      }

      #laufanzeige {
        margin: 0.75rem 0 0;
        color: var(--schrift-leise);
        font-size: 0.875rem;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Windkanal</h1>
      <p class="untertitel" id="untertitel">
        Geschwindigkeit der Luft um einen Kreis — hell ist langsam, dunkel ist schnell.
      </p>

      <div class="bedienleiste">
        <div>
          <span class="gruppentitel" id="formtitel">Form</span>
          <!-- Die vier Schaltflächen entstehen in bedienung.js aus der Liste in
               start.js — die Formen stehen dadurch nur an einer Stelle. -->
          <div class="knopfreihe" id="formauswahl" role="group" aria-labelledby="formtitel"></div>
        </div>
        <div>
          <span class="gruppentitel" id="lauftitel">Ablauf</span>
          <div class="knopfreihe" role="group" aria-labelledby="lauftitel">
            <button type="button" class="schaltflaeche" id="laufschalter">Anhalten</button>
            <button type="button" class="schaltflaeche" id="ruecksetzer">Zurücksetzen</button>
          </div>
        </div>
      </div>

      <canvas id="stroemungsbild" aria-label="Farbfeld der Strömungsgeschwindigkeit im Kanal"></canvas>
      <p id="laufanzeige">Die Rechnung läuft an …</p>
    </main>

    <script type="module" src="src/ui/start.js"></script>
  </body>
</html>
